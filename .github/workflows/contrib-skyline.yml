# Builds a colorful 3D "skyline" of your contributions and commits the SVGs
# into a profile-3d-contrib/ folder.
name: Contribution Skyline

on:
  schedule:
    - cron: "0 18 * * *"   # once a day
  workflow_dispatch:        # lets you run it by hand
  push:
    branches: [main]
    paths: [".github/workflows/contrib-skyline.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --cached --quiet || (git commit -m "Update contribution skyline" && git push)
